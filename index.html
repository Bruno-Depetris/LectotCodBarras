<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector de códigos de barras</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <h1>Lector de códigos de barras</h1>

    <div class="div_general">
        <div class="div_estado_conexion">
            <p id="estado">Pulsa Iniciar para comenzar.</p>
        </div>
        
        <div class="div_camara">
            <video id="camara" class="camara" autoplay muted playsinline></video>
        </div>

        <p>Resultado: <span id="resultado">Sin leer</span></p>


        <button id="botonIniciar" type="button">Iniciar</button>
        <button id="botonDetener" type="button" disabled>Detener</button>

        <div class="div_envio">
            <label for="campoSesion">Sesion del panel</label>
            <input id="campoSesion" type="text" inputmode="latin" autocomplete="off"
                   placeholder="Ej: K7RQ2" maxlength="32">
            <p class="ayuda_envio">
                Escribí la sesion que muestra el panel de administracion en Configuracion.
            </p>

            <button id="botonEnviar" type="button" disabled>Enviar al panel</button>
            <p id="estadoEnvio" class="estado_envio"></p>
        </div>
    </div>
</body>
<script type="module" src="./script.js"></script>
</html>
